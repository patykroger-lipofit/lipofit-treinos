<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lipofit · Semana 1</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g1:#380089;--g2:#843b1b;
  --card:rgba(255,255,255,0.10);
  --card2:rgba(255,255,255,0.17);
  --borda:rgba(255,255,255,0.18);
  --txt:#f5eaff;--txt2:#d4b8f0;--txt3:#b89ad4;
}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 100%) fixed;color:var(--txt);min-height:100vh}

.header-wrap{width:100%;background:transparent;text-align:center;padding-bottom:12px}
.header-wrap img{width:100%;display:block;margin:0 auto}
.header-sub{font-size:0.95rem;letter-spacing:2px;font-weight:600;color:rgba(255,255,255,0.9);padding:12px 20px 6px;text-transform:uppercase}

#tela-inicio{display:flex;flex-direction:column;align-items:center;min-height:100vh}
.nivel-section{width:100%;max-width:480px;padding:22px 20px 8px}
.slabel{font-size:.82rem;color:var(--txt2);letter-spacing:2px;font-weight:600;display:block;margin-bottom:12px;text-transform:uppercase}
.nivel-bar{display:flex;gap:8px}
.nivel-btn{flex:1;padding:10px 6px;border:1.5px solid var(--borda);border-radius:8px;background:transparent;color:var(--txt2);font-size:.72rem;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;transition:all .2s}
.nivel-btn.active{background:rgba(255,255,255,0.22);color:var(--txt);border-color:rgba(255,255,255,0.4)}
.treinos-grid{width:100%;max-width:480px;padding:14px 20px 32px;display:flex;flex-direction:column;gap:10px}
.treino-card{background:var(--card);border-radius:14px;padding:16px 18px;border:1px solid var(--borda);cursor:pointer;display:flex;align-items:center;gap:16px;transition:all .2s}
.treino-card:active{transform:scale(.99);background:var(--card2)}
.treino-num{width:42px;height:42px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--txt);font-size:.85rem;font-weight:700}
.treino-info h3{font-size:.88rem;font-weight:600;color:var(--txt)}
.treino-info p{font-size:.68rem;color:var(--txt3);margin-top:3px;font-weight:500}
.treino-arrow{color:var(--borda);font-size:1.2rem;margin-left:auto}

#tela-treino{display:none;flex-direction:column;min-height:100vh}
.treino-header{width:100%;background:rgba(0,0,0,0.25);padding:14px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);border-bottom:1px solid var(--borda)}
.btn-voltar{background:none;border:none;color:var(--txt);font-size:1.3rem;cursor:pointer;padding:4px;opacity:.8;font-family:'Poppins',sans-serif}
.th-info h1{font-size:1.1rem;font-weight:700;color:var(--txt);line-height:1.2}
.th-info p{font-size:.92rem;color:var(--lilas);margin-top:4px;font-weight:600}
.treino-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 18px;gap:12px;max-width:480px;width:100%;margin:0 auto}

.progresso{display:flex;gap:5px;width:100%}
.prog-dot{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.15);transition:all .3s}
.prog-dot.done{background:rgba(255,255,255,0.5)}
.prog-dot.current{background:#fff}

.ex-card{width:100%;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--borda)}
.ex-header{padding:16px 18px 12px}
.ex-numero{font-size:.9rem;color:var(--txt3);font-weight:600;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
.ex-nome{font-size:1.05rem;font-weight:700;color:var(--txt);line-height:1.3}
.ex-instrucao{font-size:.76rem;color:var(--txt2);margin-top:6px;font-weight:500}
.video-wrap{position:relative;width:100%;padding-bottom:56.25%;background:rgba(0,0,0,0.4)}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.video-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:12px}
.play-circle{width:58px;height:58px;border:1.5px solid rgba(255,255,255,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08)}
.play-circle svg{width:20px;height:20px;fill:#fff;margin-left:3px}
.video-placeholder p{font-size:.68rem;color:rgba(255,255,255,.6);font-family:'Poppins',sans-serif;font-weight:400;letter-spacing:2px;text-transform:uppercase}

.timer-section{width:100%;background:var(--card);border-radius:16px;padding:20px 18px;text-align:center;border:1px solid var(--borda)}
.timer-label{font-size:.6rem;color:var(--txt3);letter-spacing:3px;font-weight:600;margin-bottom:14px;text-transform:uppercase}
.timer-ring{position:relative;width:130px;height:130px;margin:0 auto 12px}
.timer-ring svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,0.12);stroke-width:4}
.ring-prog{fill:none;stroke-width:4;stroke-linecap:round;stroke:rgba(255,255,255,0.85);transition:stroke-dashoffset .9s linear}
.ring-prog.alerta{stroke:#ff6b6b}
.timer-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.1rem;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.timer-num.alerta{color:#ff6b6b}
.timer-status{font-size:.68rem;color:var(--txt3);font-weight:500;letter-spacing:1px;text-transform:uppercase}

.btn-row{display:flex;gap:10px;width:100%}
.btn{flex:1;padding:14px;border-radius:10px;border:none;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;letter-spacing:.5px;text-transform:uppercase;transition:all .15s}
.btn:active{transform:scale(.97);opacity:.9}
.btn-primary{background:rgba(255,255,255,0.2);color:var(--txt);border:1px solid rgba(255,255,255,0.3)}
.btn-ghost{flex:none;width:52px;background:var(--card);color:var(--txt2);border:1px solid var(--borda);font-size:.85rem}

.lista{width:100%;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--borda);margin-bottom:20px}
.lista-titulo{padding:11px 18px;font-size:.6rem;color:var(--txt3);letter-spacing:3px;font-weight:600;border-bottom:1px solid var(--borda);text-transform:uppercase}
.lista-item{display:flex;align-items:center;padding:12px 18px;gap:14px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .15s}
.lista-item:last-child{border-bottom:none}
.lista-item:active,.lista-item.current{background:var(--card2)}
.lista-item.done{opacity:.35}
.lista-num{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;color:var(--txt)}
.lista-item.current .lista-num{background:rgba(255,255,255,.3)}
.lista-nome{font-size:.8rem;font-weight:600;color:var(--txt)}
.lista-reps{font-size:.67rem;color:var(--txt3);margin-top:2px;font-weight:400}

/* TELA INSTRUÇÃO */
#tela-instrucao{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px;gap:0}
.instr-wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:16px}
.instr-tipo{font-size:.88rem;color:var(--txt2);letter-spacing:2px;font-weight:700;text-transform:uppercase;text-align:center}
.instr-titulo{font-size:1.25rem;font-weight:700;color:var(--txt);text-align:center;line-height:1.3}
.instr-cards{display:flex;flex-direction:column;gap:10px}
.instr-card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:14px 16px;display:flex;align-items:flex-start;gap:14px}
.instr-icon{font-size:1.3rem;flex-shrink:0;margin-top:1px}
.instr-text{font-size:.82rem;color:var(--txt2);line-height:1.5;font-weight:400}
.instr-text strong{color:var(--txt);font-weight:600}
.btn-comecar{width:100%;padding:16px;border-radius:12px;border:none;background:rgba(255,255,255,0.2);color:var(--txt);font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(255,255,255,0.3);margin-top:4px}

#tela-final{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:14px;min-height:100vh}
.final-logo-wrap{width:100%;max-width:360px;border-radius:16px;overflow:hidden;margin-bottom:8px}
.final-logo-wrap img{width:100%;display:block}
.final-icon{width:68px;height:68px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:50%;display:flex;align-items:center;justify-content:center}
.final-icon svg{width:28px;height:28px;fill:#fff}
#tela-final h2{font-size:1.35rem;color:var(--txt);font-weight:700}
#tela-final p{color:var(--txt2);font-size:.85rem;line-height:1.7;max-width:300px}
.btn-pular{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.4);font-size:.65rem;font-weight:500;cursor:pointer;font-family:'Poppins',sans-serif;letter-spacing:1px;text-transform:uppercase;display:none}
.treino-badge-wrap{text-align:center;margin-bottom:12px}
.treino-badge{display:inline-block;font-size:.95rem;color:rgba(255,255,255,0.9);letter-spacing:2px;font-weight:700;text-transform:uppercase}
.btn-final{width:100%;max-width:300px;padding:15px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:var(--txt);font-size:.82rem;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;letter-spacing:1px;text-transform:uppercase;margin-top:8px}
.hidden{display:none!important}
.countdown-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.75);
  display:none;align-items:center;justify-content:center;
  z-index:100;
}
.countdown-num{
  font-size:8rem;font-weight:800;color:#fff;
  font-family:'Poppins',sans-serif;
  animation:pop .8s ease-out;
}
@keyframes pop{
  0%{transform:scale(0.5);opacity:0}
  50%{transform:scale(1.2);opacity:1}
  100%{transform:scale(1);opacity:1}
}
</style>
</head>

const C=2*Math.PI*58;
let nv=0,ta=null,ea=0,fase='cond'; // fase: 'aq' ou 'cond'
let iv=null,ts=60,tt=60,tr=false;

// Audio — unlockAudio() chamado no primeiro toque
let ac=null;
function unlockAudio(){
  if(!ac){
    ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(0,ac.currentTime);
    o.start(ac.currentTime);o.stop(ac.currentTime+0.001);
  } else if(ac.state==='suspended'){ac.resume();}
}
function bp(f,i,d,v=0.3){
  if(!ac)return; // sem áudio se não desbloqueado
  const o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);
  o.frequency.value=f;o.type='sine';
  g.gain.setValueAtTime(v,ac.currentTime+i);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i+d);
  o.start(ac.currentTime+i);o.stop(ac.currentTime+i+d+0.05);
}
function bfim(){bp(784,0,.15,.8);bp(784,.2,.15,.8);bp(784,.4,.15,.8);bp(1047,.65,.6,.9);}
function bal(){bp(880,0,.15,.7);}

function setNivel(n){nv=n;document.querySelectorAll('.nivel-btn').forEach((b,i)=>b.classList.toggle('active',i===n));}

function renderInicio(){
  document.getElementById('treinos-grid').innerHTML=T.map((t,i)=>`
    <div class="treino-card" onclick="abrirTreino(${i})">
      <div class="treino-num">${t.num}</div>
      <div class="treino-info"><h3>${t.titulo}</h3><p>${t.subtitulo}</p></div>
      <div class="treino-arrow">›</div>
    </div>`).join('');
}

// etapa: 'aq_instrucao' | 'aq' | 'cond_instrucao' | 'cond'
let etapa = 'aq_instrucao';
let roundAtual = 1;
let totalRounds = 1;

function mostrarInstrucao(chave){
  const instr = INSTRUCOES[chave];
  if (!instr) return;
  document.getElementById('instr-tipo').textContent = instr.tipo;
  document.getElementById('instr-titulo').textContent = instr.titulo;
  document.getElementById('instr-cards').innerHTML = instr.itens.map(it =>
    `<div class="instr-card"><div class="instr-icon">${it.icon}</div><div class="instr-text">${it.texto}</div></div>`
  ).join('');
  document.getElementById('tela-inicio').style.display = 'none';
  document.getElementById('tela-treino').style.display = 'none';
  document.getElementById('tela-final').style.display = 'none';
  document.getElementById('tela-instrucao').style.display = 'flex';
}

function abrirTreino(i){
  ta = i;
  etapa = 'aq_instrucao';
  // Atualizar header-sub na tela inicial
  const headerSub = document.getElementById('header-sub');
  if(headerSub){
    headerSub.textContent = T[i].semanaLabel + ' · SEMANA ' + T[i].semNum + ' · TREINO ' + (i+1);
  }
  // Atualizar badge de treino na tela de instrução e treino
  const treinoBadge = document.getElementById('treino-badge');
  if(treinoBadge){
    treinoBadge.textContent = T[i].semanaLabel + ' · SEMANA ' + T[i].semNum + ' · TREINO ' + (i+1);
  }
  mostrarInstrucao('AQUECIMENTO');
}

function comecarTreino(){
  unlockAudio(); ac && ac.state==='suspended' && ac.resume();
  const badge = T[ta].semanaLabel + ' · SEMANA ' + T[ta].semNum + ' · TREINO ' + (ta+1);
  if (etapa === 'aq_instrucao') {
    etapa = 'aq';
    ea = 0; fase = 'aq';
    roundAtual = 1; totalRounds = 2;
    document.getElementById('tela-instrucao').style.display = 'none';
    document.getElementById('tela-treino').style.display = 'flex';
    document.getElementById('th-titulo').textContent = badge;
    document.getElementById('th-subtitulo').textContent = 'Aquecimento · 5 min';
    rEx();
  } else if (etapa === 'cond_instrucao') {
    etapa = 'cond';
    fase = 'cond'; ea = 0;
    roundAtual = 1; totalRounds = 4;
    document.getElementById('tela-instrucao').style.display = 'none';
    document.getElementById('tela-treino').style.display = 'flex';
    document.getElementById('th-titulo').textContent = badge;
    document.getElementById('th-subtitulo').textContent = T[ta].titulo;
    rEx();
  }
}

function voltarInicio(){
  pT();
  document.getElementById('tela-treino').style.display='none';
  document.getElementById('tela-final').style.display='none';
  document.getElementById('tela-instrucao').style.display='none';
  document.getElementById('tela-inicio').style.display='flex';
}

function getExs(){
  if(fase==='aq') return T[ta].aq.map(e=>(({nome:e.nome,reps:'30 segundos de atividade',yt:e.yt})));
  return T[ta].n[nv];
}

function rEx(){
  const exs=getExs(),ex=exs[ea];
  const total=exs.length;
  document.getElementById('progresso').innerHTML=exs.map((_,i)=>`<div class="prog-dot ${i<ea?'done':i===ea?'current':''}"></div>`).join('');
  const labelFase = fase==='aq' ? 'Aquecimento' : 'Exercício';
  const labelRound = `Round ${roundAtual} de ${totalRounds}`;
  document.getElementById('ex-numero').textContent=`${labelFase} ${ea+1} de ${total} · ${labelRound}`;
  document.getElementById('ex-nome').textContent=ex.nome;
  document.getElementById('ex-instrucao').textContent=ex.reps;
  const f=document.getElementById('video-frame');f.classList.add('hidden');f.src='';
  document.getElementById('video-placeholder').classList.remove('hidden');
  pT();
  ts=fase==='aq'?30:T[ta].ts;tt=ts;
  document.getElementById('timer-label').textContent=fase==='aq'?'Atividade':T[ta].tl;
  uD();
  document.getElementById('timer-status').textContent='Pressione iniciar quando estiver pronta';
  document.getElementById('btn-principal').textContent='Iniciar';
  // Botão pular fase
  const btnPular = document.getElementById('btn-pular');
  if(fase==='aq'){
    btnPular.style.display='block';
    btnPular.textContent='Pular aquecimento → ir para o treino';
  } else {
    btnPular.style.display='none';
  }

  document.getElementById('lista-items').innerHTML=exs.map((e,i)=>`
    <div class="lista-item ${i===ea?'current':i<ea?'done':''}" onclick="iEx(${i})">
      <div class="lista-num">${i<ea?'✓':i+1}</div>
      <div class="lista-info"><div class="lista-nome">${e.nome}</div><div class="lista-reps">${e.reps}</div></div>
    </div>`).join('');
}

function abrirVideo(){
  const exs=getExs(),yt=exs[ea].yt;
  if(!yt||yt==='#')return;
  const ytId=yt.includes('shorts/')?yt.split('shorts/')[1]:yt.includes('youtu.be/')?yt.split('youtu.be/')[1]:yt;
  const f=document.getElementById('video-frame');
  f.src=`https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
  f.classList.remove('hidden');
  document.getElementById('video-placeholder').classList.add('hidden');
}

function acaoPrincipal(){
  unlockAudio();
  if(ac && ac.state==='suspended') ac.resume();
  tr?pT():iT();
}

function iniciarContagem(callback){
  const overlay=document.getElementById('countdown-overlay');
  const numEl=document.getElementById('countdown-num');
  let count=3;
  overlay.style.display='flex';
  numEl.textContent=count;
  // Bipe de contagem
  bp(880,0,0.15,0.8);
  const ci=setInterval(()=>{
    count--;
    if(count>0){
      numEl.textContent=count;
      // Força re-animação
      numEl.style.animation='none';
      numEl.offsetHeight; // reflow
      numEl.style.animation='pop .8s ease-out';
      bp(880,0,0.15,0.8);
    } else {
      overlay.style.display='none';
      bp(1047,0,0.25,0.9); // bipe de início
      clearInterval(ci);
      callback();
    }
  },1000);
}

function iT(){
  iniciarContagem(()=>{
  tr=true;document.getElementById('btn-principal').textContent='Pausar';
  iv=setInterval(()=>{
    ts--;uD();
    if(ts<=3&&ts>0)bal();
    if(ts<=0){
      clearInterval(iv);tr=false;bfim();
      if(navigator.vibrate)navigator.vibrate([150,80,150,80,300]);
      const exs=getExs();
      if(ea<exs.length-1){
        ea++;rEx();
      } else if(roundAtual < totalRounds){
        roundAtual++;
        ea=0;
        rEx();
      } else if(fase==='aq'){
        etapa = 'cond_instrucao';
        mostrarInstrucao(T[ta].fmt||'AMRAP');
      } else {
        document.getElementById('tela-treino').style.display='none';
        document.getElementById('tela-final').style.display='flex';
      }
    }
  },1000);
  }); // fim iniciarContagem
}

function pT(){clearInterval(iv);tr=false;const b=document.getElementById('btn-principal');if(b)b.textContent='Iniciar';}

function uD(){
  const m=Math.floor(ts/60),s=ts%60;
  const el=document.getElementById('timer-display');
  el.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  el.className='timer-num'+(ts<=5?' alerta':'');
  document.getElementById('timer-progress').style.strokeDashoffset=C*(1-ts/tt);
  document.getElementById('timer-progress').className='ring-prog'+(ts<=5?' alerta':'');
  document.getElementById('timer-status').textContent=tr?(ts<=5?'Quase lá!':'Em andamento...'):'Pausado';
}

function pularFase(){
  pT(); // parar timer
  etapa = 'cond_instrucao';
  mostrarInstrucao(T[ta].fmt||'AMRAP');
}

function proximoEx(){
  const e=getExs();
  if(ea<e.length-1){
    ea++;rEx();
  } else if(roundAtual < totalRounds){
    roundAtual++;ea=0;rEx();
  } else if(fase==='aq'){
    etapa='cond_instrucao';
    mostrarInstrucao(T[ta].fmt||'AMRAP');
  } else {
    document.getElementById('tela-treino').style.display='none';
    document.getElementById('tela-final').style.display='flex';
  }
}
function anteriorEx(){
  if(ea>0){
    ea--;rEx();
  } else if(roundAtual>1){
    roundAtual--;ea=getExs().length-1;rEx();
  } else if(fase==='cond'){
    // Volta para o aquecimento mostrando instrução
    etapa='aq_instrucao';
    mostrarInstrucao('AQUECIMENTO');
  }
}
function iEx(i){ea=i;rEx();}

// Manter AudioContext ativo — retoma se suspenso a cada interação
document.addEventListener('touchstart', function() {
  if(ac && ac.state==='suspended') ac.resume();
});
document.addEventListener('click', function() {
  if(ac && ac.state==='suspended') ac.resume();
});

renderInicio();
</script>
